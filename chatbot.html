<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIチャットボット — DOTCON / DOTCON PLUS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Hiragino Sans','Meiryo',sans-serif;background:#f0f2f5;color:#333;line-height:1.6;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ヘッダー */
.header{background:linear-gradient(135deg,#1a73e8 0%,#0d47a1 100%);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.15);flex-shrink:0}
.back-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:.15s;white-space:nowrap;flex-shrink:0}
.back-btn:hover{background:rgba(255,255,255,.3)}
.header-center{flex:1;text-align:center}
.header-title{font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.header-sub{font-size:11px;opacity:.8;margin-top:2px}
.header-spacer{width:100px;flex-shrink:0}

/* カテゴリナビ */
#categories{background:#fff;padding:8px 16px;border-bottom:2px solid #e0e0e0;display:flex;gap:5px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
#categories::-webkit-scrollbar{height:3px}
#categories::-webkit-scrollbar-thumb{background:#c5d8fb;border-radius:2px}
.cat-btn{background:none;border:1.5px solid transparent;padding:6px 12px;font-size:12px;font-weight:600;color:#666;cursor:pointer;border-radius:20px;transition:.15s;white-space:nowrap;font-family:inherit}
.cat-btn:hover{background:#e8f0fe;color:#1a73e8;border-color:#c5d8fb}

/* チャットエリア */
#chat-wrap{flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
#chat::-webkit-scrollbar{width:5px}
#chat::-webkit-scrollbar-thumb{background:#d0d7e6;border-radius:3px}

/* メッセージ */
.msg{display:flex;flex-direction:column;max-width:90%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.bot{align-self:flex-start;align-items:flex-start;max-width:95%}
.msg-label{font-size:11px;color:#aaa;margin-bottom:3px;padding:0 4px}
.bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;word-break:break-word}
.msg.user .bubble{background:#1a73e8;color:#fff;border-bottom-right-radius:3px}
.msg.bot .bubble{background:#fff;color:#333;border-bottom-left-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px}

/* 回答カード */
.answer-card{background:#fff;border:1px solid #e0e0e0;border-left:4px solid #1a73e8;border-radius:10px;padding:14px;margin-top:6px}
.answer-card+.answer-card{margin-top:10px}
.citation{display:inline-flex;align-items:center;gap:4px;background:#e8f0fe;border:1px solid #c5d8fb;color:#1a73e8;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:8px}
.narrative{font-size:13px;color:#333;line-height:1.75;margin-bottom:8px}
mark.hl{background:#fff9c4;color:inherit;border-radius:2px;padding:0 1px;text-decoration:underline;text-decoration-color:#f9a825;text-underline-offset:2px}
.detail-toggle{color:#1a73e8;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin:4px 0 8px;user-select:none;font-weight:600}
.detail-toggle:hover{text-decoration:underline}
.detail-body{display:none}
.detail-body.open{display:block}
.point-list{margin-top:6px}
.point-item{font-size:12px;color:#555;padding:2px 0;display:flex;gap:6px;align-items:flex-start}
.point-item::before{content:"▸";color:#1a73e8;flex-shrink:0}
.note-box{margin-top:8px;padding:8px 10px;background:#fff8e1;border-left:3px solid #f9a825;border-radius:4px;font-size:12px;color:#795548}

/* サジェスト */
.suggest-block{margin-top:12px;padding-top:12px;border-top:1px dashed #e0e0e0}
.suggest-label{font-size:11px;color:#888;font-weight:700;margin-bottom:6px}
.suggest-chips{display:flex;flex-wrap:wrap;gap:6px}
.suggest-chip{background:#f5f7fa;border:1.5px solid #e0e0e0;color:#1a73e8;padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600;transition:.15s;line-height:1.4}
.suggest-chip:hover{background:#e8f0fe;border-color:#1a73e8}

/* 入力エリア */
#input-area{background:#fff;border-top:2px solid #e0e0e0;padding:12px 16px;display:flex;gap:8px;flex-shrink:0;align-items:center}
#user-input{flex:1;border:1.5px solid #e0e0e0;border-radius:24px;padding:10px 18px;font-size:13px;outline:none;font-family:inherit;transition:.15s;background:#f5f7fa;color:#333}
#user-input:focus{border-color:#1a73e8;background:#fff}
#send-btn{background:#1a73e8;color:#fff;border:none;border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
#send-btn:hover{background:#1558b0;transform:scale(1.05)}

/* タイピング */
.typing-indicator{display:flex;align-items:center;gap:4px;padding:10px 14px;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.dot{width:7px;height:7px;background:#bbb;border-radius:50%;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

@media(max-width:640px){
  .header{padding:10px 12px}
  .header-spacer{display:none}
  #chat-wrap{padding:10px 10px}
  #input-area{padding:10px 12px}
}
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="./" title="ダッシュボードのQ&Aへ戻る">← Q&Aへ戻る</a>
  <div class="header-center">
    <div class="header-title">🤖 DOTCON AIチャットボット</div>
    <div class="header-sub">施工・貯留量・見積・行政対応など140項目から即時回答</div>
  </div>
  <div class="header-spacer"></div>
</div>

<div id="categories">
  <button class="cat-btn" onclick="categorySearch('基本仕様')">📋 基本仕様</button>
  <button class="cat-btn" onclick="categorySearch('貯留量計算')">💧 貯留量計算</button>
  <button class="cat-btn" onclick="categorySearch('浸透計算')">🌱 浸透計算</button>
  <button class="cat-btn" onclick="categorySearch('施工')">🔨 施工方法</button>
  <button class="cat-btn" onclick="categorySearch('荷重')">🚗 荷重・構造</button>
  <button class="cat-btn" onclick="categorySearch('製品形状')">🧩 製品形状</button>
  <button class="cat-btn" onclick="categorySearch('見積')">💰 見積・単価</button>
  <button class="cat-btn" onclick="categorySearch('行政')">🏛️ 行政・条例</button>
  <button class="cat-btn" onclick="categorySearch('営業')">📈 営業・提案</button>
  <button class="cat-btn" onclick="categorySearch('設計')">📐 設計</button>
  <button class="cat-btn" onclick="categorySearch('維持管理')">🔧 維持管理</button>
  <button class="cat-btn" onclick="categorySearch('比較')">⚖️ 他工法比較</button>
</div>

<div id="chat-wrap">
  <div id="chat"></div>
</div>

<div id="input-area">
  <input id="user-input" type="text" placeholder="例：路盤は何cm必要ですか？　大型車は大丈夫ですか？" maxlength="200" />
  <button id="send-btn" onclick="handleSend()" title="送信">➤</button>
</div>

<script>
// =============================================
// Q&Aデータ（140項目）
// =============================================
const QA = [
  // 1. 基本仕様関連
  {id:1,cat:"基本仕様",q:"ドットコンとは何か",a:"ドットコンは、雨水を「通す」「一時的に貯める」「地中へ浸透させる」ことを同時に行う舗装システムです。一般的な土間コンクリートは水を流す前提ですが、ドットコンは地面そのものに雨水処理機能を持たせる考え方です。お施主様には「雨を捨てる地面ではなく、雨を受け止める地面」と説明すると伝わりやすいです。",points:["駐車場、アプローチ、歩道、広場、店舗外構などで提案しやすい","舗装として使いながら雨水対策を行える","透水だけでなく貯留機能を持つ点を必ず説明する"],note:"全ての雨を処理しきる製品ではありません。降雨量、地盤、施工面積によってはオーバーフロー設計が必要です。"},
  {id:2,cat:"基本仕様",q:"ドットコンとドットコンプラスの違い",a:"従来型ドットコンは穴から雨水を取り込む構造です。ドットコンプラスは目地から雨水を取り込む構造に進化しており、デザイン性、歩行性、施工性、荷重分散、クラック抑制の面で提案しやすくなっています。",points:["従来型は機能を直感的に見せやすい","プラスは住宅、店舗、公共空間で使いやすい","目地構造によりタイル調の見た目を作れる"],note:"案件によって従来型が向く場合とプラスが向く場合があります。見た目、歩行性、用途、コストで選定します。"},
  {id:3,cat:"基本仕様",q:"通常砕石との違い",a:"砕石だけでも空隙は作れますが、表面の舗装としては使いにくく、車両通行や歩行の快適性、景観性に課題があります。ドットコンは砕石路盤の貯留機能を活かしながら、表面をコンクリート舗装として利用できる点が大きな違いです。",points:["砕石の空隙を活かして貯留量を増やせる","舗装面として車両や歩行に使える","見た目と雨水対策を両立できる"]},
  {id:4,cat:"基本仕様",q:"地下貯留槽との違い",a:"地下貯留槽は雨水を一箇所に集めて貯める集中型の施設です。ドットコンは施工面全体で受け止める分散型の雨水対策です。大容量の一括貯留には地下貯留槽が向きますが、外構や駐車場の面積を活用して排水負担を減らす場合はドットコンが提案しやすいです。",points:["地下貯留槽より掘削が小さくなる場合がある","舗装機能と雨水対策を兼用できる","目視しやすく維持管理の説明がしやすい"],note:"大規模開発で必要貯留量が大きい場合は、地下貯留槽やトレンチとの併用も検討します。"},
  {id:5,cat:"基本仕様",q:"浸透型と貯留型の違い",a:"浸透型は水を地中へ逃がすことが主目的です。貯留型は雨水を一時的に受け止め、流出ピークを抑えることが主目的です。ドットコンはこの両方を組み合わせ、浸透しきれない短時間豪雨でも一度受け止める余裕を作ります。",points:["集中豪雨では透水だけでなく貯留が重要","地盤が浸透しにくい場合は貯留と排水逃がしを組み合わせる","行政協議ではピークカットという言葉が使いやすい"]},
  {id:6,cat:"基本仕様",q:"ドットコンの基本機能",a:"基本機能は、透水、貯留、浸透、排水負担軽減、表面温度上昇の抑制、景観性です。水を早く側溝へ流すだけでなく、舗装面と路盤で受け止め、地中へ戻すことで敷地外へ出る雨水を減らす発想です。",points:["水たまり対策として説明しやすい","雨水条例対策の候補になり得る","環境配慮型外構として提案できる"]},
  {id:7,cat:"基本仕様",q:"ドットコンプラスの基本構造",a:"ドットコンプラスは再生ポリプロピレン製フレームを敷き、そこへコンクリートを打設して目地構造を作る舗装です。フレームが型枠の役割を持つため、脱型作業を減らしやすく、施工の省力化につながります。",points:["目地から雨水を取り込む","約600mmピッチの構造で荷重を分散しやすい","意匠性のある外構にしやすい"],note:"フレームは仕上がりの一部となるため、設置精度とレベル管理が重要です。"},
  {id:8,cat:"基本仕様",q:"一般的な透水舗装との違い",a:"一般的な透水舗装は水を通すことを主目的とするものが多く、長期的な目詰まりや構造耐久性が課題になる場合があります。ドットコンは、目地や空間を使って水を受け止める構造であり、舗装としての利用性と貯留機能を同時に持つ点が特徴です。",points:["「通す」だけでなく「受け止める」ことを説明する","砕石層を含めた設計で効果が大きくなる","メンテナンス方法も合わせて提案する"]},
  {id:9,cat:"基本仕様",q:"採用しやすい場所",a:"戸建て駐車場、アプローチ、店舗前、集合住宅外構、公共施設の歩道、公園、工場や物流施設の一部、寺院や景観外構などで採用しやすいです。水たまりが発生しやすい場所、排水勾配が取りにくい場所、環境価値を示したい場所に向いています。",points:["駐車場は提案しやすい用途","公共案件は計算書と断面図が重要","店舗では景観と環境配慮を同時に訴求できる"]},
  {id:10,cat:"基本仕様",q:"採用前に確認すること",a:"採用前には、用途、車両荷重、地盤の浸透性、地下水位、周囲からの土砂流入、排水先、行政基準、維持管理者を確認します。特に地盤と排水先を確認しないまま「水が全部消える」と説明しないことが重要です。",points:["現場写真だけでなくレベルと排水先を確認する","浸透しにくい地域はオーバーフローを設ける","施工後の清掃方法も事前に説明する"]},
  // 2. 貯留量計算関連
  {id:11,cat:"貯留量計算",q:"必要貯留量の基本式",a:"必要貯留量は、集水面積 × 降雨量 × 流出係数で求めます。例えば100m²の駐車場に50mmの雨が降ると、流出係数を1.0とした場合は100 × 0.05 = 5.0m³の雨水が発生します。流出係数0.9なら4.5m³です。",points:["屋根、駐車場、アプローチを分けて計算する","50mmは1m²あたり50Lの雨と考える","行政協議では自治体指定の計算条件を優先する"]},
  {id:12,cat:"貯留量計算",q:"降雨強度からの算出",a:"30mm/h、50mm/h、100mm/hなどの時間雨量を使う場合、まず対象面積に降雨量を掛けて発生雨水量を算出します。100m²で100mm/hなら10m³/hの雨水が発生します。ドットコンはこの全量を一瞬で処理するのではなく、貯留と浸透でピークを下げます。",points:["短時間豪雨ほどオーバーフロー設計が重要","面積が大きいほど発生水量も比例して増える","路盤空隙と浸透能力を組み合わせて評価する"]},
  {id:13,cat:"貯留量計算",q:"50mm/h対応の考え方",a:"50mm/hは住宅外構や小規模施設の検討でよく使いやすい目安です。100m²なら5m³の雨水が発生します。ドットコンプラス正方形の本体貯留量だけでは100m²で約1.32m³なので、路盤空隙、地中浸透、オーバーフローを含めて設計します。",points:["本体貯留量だけで判断しない","100mm路盤を組み合わせると貯留余裕が増える","浸透性の良い地盤では排水負担軽減効果が高い"]},
  {id:14,cat:"貯留量計算",q:"100mm/h対応の考え方",a:"100mm/h級の豪雨では、100m²で10m³の雨水が発生します。この規模では、ドットコン単独で全量を抱えるというより、一時的に受け止めてピークを下げ、超過分を安全に逃がす設計が現実的です。",points:["オーバーフロー管や側溝を必ず検討する","低い場所へ水が集中しないようにする","洪水頻発地域では路盤増厚や排水併用を検討する"],note:"「100mm/hでも水が絶対あふれない」とは説明しません。現場の地盤・排水先・施工面積で結果が変わります。"},
  {id:15,cat:"貯留量計算",q:"流出係数の扱い",a:"流出係数は、降った雨のうちどれだけが流出するかを表す係数です。屋根や土間コンクリートは0.9から1.0に近く、砂利や芝は低くなります。行政計算では自治体が指定する係数を使うことが多いです。",points:["屋根は0.9から1.0で見ることが多い","アスファルトやコンクリートは0.85から1.0程度","芝や植栽は低いが、土質や勾配で変わる"]},
  {id:16,cat:"貯留量計算",q:"敷地面積換算",a:"雨水対策では、施工面積だけでなく、そこへ流れ込む集水面積を確認します。駐車場の上に降る雨だけなのか、屋根の雨樋を流入させるのか、隣地や上流側から流入するのかで必要容量が変わります。",points:["施工面積と集水面積を分けて考える","屋根雨水を入れる場合は雨樋面積も加算する","周囲からの表面水が入る場合は安全側で見る"]},
  {id:17,cat:"貯留量計算",q:"屋根面積のみの計算",a:"屋根雨水をドットコン区域へ流す場合は、屋根面積 × 降雨量で流入量を計算します。例えば屋根80m²、降雨50mmなら80 × 0.05 = 4.0m³です。雨樋を直接接続する場合は、集中流入による目詰まりや局所洗掘を避ける工夫が必要です。",points:["雨樋出口に沈砂・点検部を設けると管理しやすい","一点集中流入を避けて面で分散させる","泥や落葉が入る場合は清掃計画を用意する"]},
  {id:18,cat:"貯留量計算",q:"駐車場込みの計算",a:"住宅では、屋根、駐車場、アプローチを合算して雨水量を見ます。駐車場100m²、屋根80m²、合計180m²に50mmの雨なら9.0m³の雨水が発生します。どこまでドットコンで受け、どこからオーバーフローさせるかを決めます。",points:["対象外の雨水を入れない計画も可能","雨樋流入を入れるなら容量確認が必要","駐車場は水平に近くても水が逃げる安全経路を残す"]},
  {id:19,cat:"貯留量計算",q:"空隙率の考え方",a:"路盤材の空隙率は、行政協議など保守的な計算では10%程度を使う場合があります。一方で、単粒砕石などでは30%から40%程度の空隙を見込める場合があります。どちらを使うかは、提出先、材料、設計方針で決めます。",points:["公的協議では保守的に見る","営業説明では「路盤にも貯留余裕がある」と説明できる","材料の粒度で空隙率は変わる"],note:"計算値を大きく見せるために空隙率を過大に設定しないことが重要です。"},
  {id:20,cat:"貯留量計算",q:"安全率の設定",a:"雨量や土砂堆積、施工ばらつき、地盤浸透性の低下を考えると、安全率を見込む設計が望ましいです。一般的には1.2倍から1.5倍程度の余裕を見ることがあります。公共案件では自治体基準を優先します。",points:["必要容量ぴったりではなく余裕を持つ","豪雨地域は大きめに見る","維持管理状況も余裕量に影響する"]},
  {id:21,cat:"貯留量計算",q:"オーバーフロー容量",a:"ドットコンは一度雨を受け止めますが、貯留量や浸透量を超えた雨は安全に逃がす必要があります。オーバーフローは、敷地内で水が建物側へ行かないように、側溝、雨水桝、浸透桝、道路側排水などへ誘導します。",points:["逃がし先の高さを確認する","建物基礎へ水が向かわないようにする","豪雨時の表面流れも考える"]},
  {id:22,cat:"貯留量計算",q:"一時貯留時間",a:"一時貯留時間は、雨が降った後にどれくらいの時間で水が抜けるかという考え方です。地盤透水性が良ければ早く抜け、粘土質や地下水位が高い場所では遅くなります。抜けが遅い地域では貯留だけでなく排水逃がしが必要です。",points:["水抜け時間は地盤で大きく変わる","長時間水が残ると使い勝手に影響する","排水接続を入れることで安定する"]},
  {id:23,cat:"貯留量計算",q:"排水遅延の説明",a:"排水遅延とは、雨水を一気に流さず、時間をずらして排水することです。ドットコンは、舗装面と路盤で雨を一度受け止めるため、ピーク流出を下げる説明ができます。これは雨水流出抑制や都市型洪水対策で重要な考え方です。",points:["「全部消す」ではなく「一度受け止めて遅らせる」と説明する","雨水条例の説明に使いやすい","下流の排水負担軽減につながる"]},
  {id:24,cat:"貯留量計算",q:"貯留槽との容量比較",a:"地下貯留槽は大容量を確保しやすい一方、掘削、残土、構造物、点検費用が大きくなります。ドットコンは舗装面を使って分散的に貯留するため、小規模から中規模の外構雨水対策に向きます。",points:["大容量は貯留槽、分散型はドットコンが向く","併用で大きな効果を作れる","敷地利用を妨げにくい"]},
  {id:25,cat:"貯留量計算",q:"必要深さの算定",a:"貯留量を増やしたい場合、施工面積を増やすか、路盤厚を増やします。面積100m²で路盤を100mmから150mmにすると、空隙率10%なら0.5m³、空隙率30%なら1.5m³の貯留差が出ます。",points:["一般地域は100mmを基本にする","容量不足時は150mm以上を検討する","寒冷地や洪水頻発地域は増厚しやすい"]},
  {id:26,cat:"貯留量計算",q:"有効容量率",a:"有効容量は、実際に雨水を貯められる空間の容量です。コンクリート部分は水を貯めず、目地やフレーム内部、砕石空隙が貯留に寄与します。設計では表面仕上げだけでなく、下層構成の有効容量を見ます。",points:["本体貯留量と路盤貯留量を分ける","砂や細粒分が多いと有効空隙が減る","長期目詰まりを考えて余裕を持つ"]},
  {id:27,cat:"貯留量計算",q:"m³換算",a:"1m³は1000Lです。ドットコンプラス正方形は約13.2L/m²なので、100m²では約1320L、つまり約1.32m³の本体貯留量になります。ここに路盤空隙や地盤浸透を加えて総合的に評価します。",points:["L表記はお施主様に伝わりやすい","m³表記は行政や設計で使いやすい","1000L = 1m³で換算する"]},
  {id:28,cat:"貯留量計算",q:"m²からm³への変換",a:"面積に厚みを掛けると体積になります。100m²に厚み0.10mの路盤がある場合、体積は10m³です。空隙率10%なら1m³、30%なら3m³が水を貯める空間として見込めます。",points:["厚みは必ずm単位に直す（10cm = 0.10m）","空隙率を掛けて有効容量にする"]},
  {id:29,cat:"貯留量計算",q:"流入量計算",a:"流入量は、対象面積と降雨量で決まります。屋根から集中して入る場合、ドットコン面積よりも流入量が大きくなることがあります。その場合は、目地へ直接大量流入させず、集水桝や分散管を使って均等に処理します。",points:["屋根水を入れるなら流入位置を設計する","土砂や落葉を先に止める","一点集中は避ける"]},
  {id:30,cat:"貯留量計算",q:"ピークカット検討",a:"ピークカットは、降雨の最大流出量を下げることです。ドットコンは、雨を面で受け止め、路盤に一時貯留し、地中へ浸透させることでピークカットに寄与します。特に駐車場のような広い舗装面で効果を説明しやすいです。",points:["雨水を一気に流さないことが価値","排水管や側溝の負担軽減を説明する","公共施設や工場で提案しやすい"]},
  // 3. 浸透計算関連
  {id:31,cat:"浸透計算",q:"地盤透水係数",a:"透水係数は地盤がどれだけ水を通すかを表す数値です。砂質地盤は浸透しやすく、粘土質地盤は浸透しにくいです。ドットコンの効果は舗装単体ではなく、路床の浸透性とセットで考えます。",points:["透水試験ができると精度が上がる","火山灰や砂質土は相性が良い場合がある","粘土地盤では排水逃がしが重要"]},
  {id:32,cat:"浸透計算",q:"浸透能力確認",a:"施工前に水がどれくらい染み込むかを確認すると、計画の信頼性が上がります。簡易的には試掘して水を張り、抜ける時間を見る方法があります。公共案件では現地浸透試験や地盤資料を求められることがあります。",points:["水が長時間残るなら排水併用を検討する","土質柱状図があると判断しやすい","施工後の水抜け不安を減らせる"]},
  {id:33,cat:"浸透計算",q:"粘土層対応",a:"粘土層は水を通しにくいため、浸透だけに頼る設計は不向きです。この場合は、ドットコンで一時貯留し、オーバーフローや暗渠で安全に排水する設計が基本になります。",points:["貯留主体で考える","建物側に水を寄せない","排水桝や側溝へ逃がす"]},
  {id:34,cat:"浸透計算",q:"地下水位影響",a:"地下水位が高い場所では、地盤がすでに水で満たされているため、浸透しにくくなります。水位が高い地域では、貯留容量と排水先を確保し、必要に応じて暗渠や排水管を併用します。",points:["地下水位が高いと水抜けが遅い","浸透施設としての能力を過大評価しない","公共案件では地盤資料を確認する"]},
  {id:35,cat:"浸透計算",q:"浸透不良時の対応",a:"浸透不良が見込まれる場合は、ドットコンの下に排水層を作り、暗渠管、浸透桝、側溝、雨水管へ接続します。完全に浸透させるのではなく、一時的に受け止めてから安全に逃がす設計が有効です。",points:["排水逃がしを最初から計画する","低い場所に排水点を設ける","土砂が管へ入らないようにする"]},
  {id:36,cat:"浸透計算",q:"不織布の必要性",a:"不織布は土砂の流入を抑えたり、路盤材と路床土の混ざりを防ぐ目的で使います。ただし、水を通しにくい不織布を選ぶと浸透を阻害することがあるため、透水性のある材料を選定します。",points:["軟弱地盤では路盤保持に有効","土砂混入を抑える","製品選定時は透水性能を確認する"]},
  {id:37,cat:"浸透計算",q:"目詰まり対策",a:"目詰まりは、土砂、落葉、細かい砂、車両の汚れなどが目地や空隙に入ることで発生します。周囲の土砂流入を防ぎ、定期的に清掃することで性能を維持しやすくなります。",points:["植栽帯や裸地からの砂流入に注意","ブロワや吸引清掃を使う","泥水が流れ込む配置は避ける"]},
  {id:38,cat:"浸透計算",q:"浸透桝併用",a:"浸透桝は、ドットコンで受け止めた水の逃がし先として相性が良いです。ドットコンで面処理し、超過分を浸透桝へ逃がすことで、分散処理と安全排水を両立できます。",points:["低い位置に設ける","泥溜まりを確保する","点検できる場所に設置する"]},
  {id:39,cat:"浸透計算",q:"側方浸透",a:"水は下方向だけでなく、路盤内を横方向へ移動することがあります。敷地境界、建物基礎、隣地へ影響しないように、必要に応じて見切り、縁石、暗渠、遮水ラインを検討します。",points:["隣地へ水を流さない","建物基礎周りは慎重に計画する","水の逃げ道を図面に示す"]},
  {id:40,cat:"浸透計算",q:"浸透速度試算",a:"浸透速度は、地盤透水係数、浸透面積、水頭、目詰まり状況で変わります。簡易説明では、地盤が良ければ早く抜け、地盤が悪ければ貯留時間が長くなると伝えます。設計値が必要な場合は試験値を使います。",points:["試験値がない場合は安全側で見る","行政提出では根拠資料を添付する","長期使用では清掃状態も影響する"]},
  // 4. 施工関連
  {id:41,cat:"施工",q:"標準断面",a:"一般的なドットコンプラスの考え方は、表面にドットコンプラス、下に砕石路盤、さらに路床という構成です。一般地域では路盤100mmを基本とし、寒冷地、浸透不良地盤、洪水頻発地域、重量車両では増厚を検討します。",points:["一般地域は路盤100mmが基本","路床の状態が悪い場合は改良を検討","用途別に厚みを変える"]},
  {id:42,cat:"施工",q:"掘削深さ",a:"掘削深さは、仕上がり高さ、ドットコンプラス厚み、路盤厚、必要な敷砂や調整層で決まります。一般地域では路盤100mmを基準に、現場のレベルと排水計画に合わせて決めます。",points:["既存舗装撤去量を確認する","残土処分費も見積に入れる","仕上がり高さを玄関・道路・排水桝に合わせる"]},
  {id:43,cat:"施工",q:"砕石厚",a:"基本方針として、寒冷地や路床がしみ込みにくく洪水が頻発する地域以外では、路盤は100mmで大丈夫です。より大きな貯留量や重量車両対応が必要な場合は150mmから300mmを検討します。",points:["一般地域: 100mm","寒冷地・洪水頻発地域: 増厚検討","重量車両: 路盤品質と転圧を重視"],note:"公共工事や行政協議では、指定仕様や設計基準が優先されます。"},
  {id:44,cat:"施工",q:"路盤構成",a:"路盤材はRC40やC40などを使用することが多く、施工性、入手性、透水性、支持力を考えて選定します。貯留量を重視する場合は空隙の取りやすい材料も検討しますが、沈下しにくい締固めも重要です。",points:["材料の粒度を確認する","細粒分が多すぎると水抜けが悪くなる","転圧後の高さを管理する"]},
  {id:45,cat:"施工",q:"転圧条件",a:"施工品質で最も重要なのは転圧です。転圧不足は沈下、段差、水たまり、ひび割れの原因になります。路床と路盤をそれぞれ十分に締め固め、特に埋戻し部や配管周りは注意します。",points:["路床転圧と路盤転圧を分けて行う","配管周りは沈下しやすい","含水比が悪い土は締まりにくい"]},
  {id:46,cat:"施工",q:"舗装仕上げ種類",a:"ドットコンプラスは目地が意匠になるため、土間コンクリートよりデザイン性を出しやすいです。仕上げは金ゴテ、刷毛引き、洗い出し、化粧骨材など現場の用途と滑りにくさを考えて選びます。",points:["歩行部は滑りにくさを重視","店舗は見た目を重視","駐車場はタイヤ汚れや耐久性も考える"]},
  {id:47,cat:"施工",q:"アスファルト併用",a:"既存アスファルト駐車場の一部をドットコンへ置き換える提案も可能です。雨水が溜まりやすい低い部分、出入口付近、歩行者導線などに部分採用することで、コストを抑えながら効果を見せられます。",points:["全面でなく部分採用も可能","既存舗装との段差をなくす","排水方向を確認する"]},
  {id:48,cat:"施工",q:"コンクリート併用",a:"通常土間コンクリートとドットコンプラスを組み合わせる場合、雨水を受ける範囲と通常舗装範囲を分けます。デザインとして境界を作ることもでき、費用と機能のバランスを取りやすいです。",points:["車路は通常土間、駐車枠はドットコンなども可能","目地ラインをデザインに使う","排水がドットコン側へ集まりすぎないようにする"]},
  {id:49,cat:"施工",q:"インターロッキング対応",a:"インターロッキングはデザイン性がありますが、目地の草、沈下、段差が課題になる場合があります。ドットコンプラスはコンクリートとして一体的に使いながら、タイル調の見た目と透水貯留機能を両立しやすいです。",points:["景観提案で比較しやすい","沈下リスクは路盤品質で左右される","草対策も説明しやすい"]},
  {id:50,cat:"施工",q:"駐車場施工方法",a:"駐車場では、車の乗り入れ位置、切り返し、タイヤがよく乗る場所を確認します。路床・路盤をしっかり作り、レベルを合わせ、端部を安定させることが重要です。",points:["出入口は荷重が集中しやすい","端部処理を丁寧に行う","排水先と水勾配を確認する"]},
  {id:51,cat:"施工",q:"重機使用条件",a:"施工時の重機使用は現場条件に合わせます。ドットコンプラス本体を敷いた後は、フレームのズレや破損を防ぐため、むやみに重機で踏まないよう施工順序を管理します。",points:["材料搬入経路を確保する","打設時のポンプや一輪車動線を決める","フレーム敷設後のズレを確認する"]},
  {id:52,cat:"施工",q:"搬入条件",a:"材料はパレットや梱包で搬入されるため、車上渡し、荷下ろし場所、フォークリフトや人力荷下ろしの有無を事前に確認します。狭小地では搬入計画が工期と費用に影響します。",points:["搬入車両が入れるか確認","置き場を確保","雨天時の材料保管も考える"]},
  {id:53,cat:"施工",q:"車上渡し条件",a:"参考見積では車上渡し条件になることがあります。車上渡しは配送車からの荷下ろしを現場側で行う意味です。荷下ろし人員や重機が必要か事前に確認します。",points:["荷下ろし費用を別途見る","現場住所と道路幅を確認","時間指定や小運搬を確認"]},
  {id:54,cat:"施工",q:"パレット搬入",a:"ドットコンプラス部材は段ボール梱包やパレット発送となる場合があります。パレット数量、仮置きスペース、雨養生、開梱作業を見積と工程へ入れておくと現場がスムーズです。",points:["仮置き場所が狭いと小運搬が増える","開梱ゴミの処理も必要","数量確認を納品時に行う"]},
  {id:55,cat:"施工",q:"狭小地施工",a:"狭小地では重機が入らないため、人力掘削、小運搬、少量打設になることがあります。ドットコンプラスは型枠作業を減らしやすい一方、材料置き場と打設動線の確保が重要です。",points:["ミキサー車やポンプ車の配置を確認","手練りより生コン搬入を優先","工期と人工が増える場合がある"]},
  {id:56,cat:"施工",q:"勾配処理",a:"ドットコンは水を受け止めるため、従来のような大きな水勾配を必要としにくい場合があります。ただし、完全な無勾配でよいという意味ではなく、豪雨時の逃げ方向や表面水の安全経路は必要です。",points:["建物側へ水を向けない","低い逃げ先を確保する","水平施工でもオーバーフロー経路を作る"]},
  {id:57,cat:"施工",q:"排水接続",a:"浸透しきれない水は排水桝、側溝、暗渠へ接続します。排水接続は、水が溢れた時に建物や隣地へ向かわないようにする安全装置です。",points:["接続先の高さを確認","逆流しないようにする","泥溜まりや点検口を設ける"]},
  {id:58,cat:"施工",q:"暗渠接続",a:"浸透不良地盤や地下水位が高い地域では、路盤内に暗渠管を設けると安定します。暗渠は通常時に水を抜き、豪雨時にはオーバーフロー経路として機能します。",points:["有孔管と砕石を組み合わせる","勾配を確保する","点検できるようにする"]},
  {id:59,cat:"施工",q:"オーバーフロー管径",a:"管径は集水面積、想定降雨、排水先能力で決めます。住宅外構では小口径で済む場合もありますが、屋根水や広い駐車場を受ける場合は十分な管径を検討します。",points:["雨樋流入がある場合は大きめに見る","詰まりを考えて点検口を設ける","自治体基準があれば従う"]},
  {id:60,cat:"施工",q:"施工手順",a:"基本手順は、既存撤去、掘削、路床整正、路盤敷き均し、転圧、フレーム敷設、レベル確認、必要に応じて鉄筋、コンクリート打設、仕上げ、養生、清掃です。各工程で高さと水の逃げ方向を確認します。",points:["レベル管理が仕上がりを左右する","打設前にフレームのズレを直す","養生期間中の車両乗り入れを防ぐ"]},
  // 5. 荷重・構造関連
  {id:61,cat:"荷重",q:"乗用車対応",a:"一般住宅の普通車駐車場では、ドットコンプラスは非常に提案しやすい用途です。路盤100mmを基本に、路床をしっかり転圧すれば、通常の駐車利用に対応しやすいです。",points:["タイヤが乗る位置の路盤を丁寧に作る","出入口の端部補強を行う","養生前の乗り入れは避ける"]},
  {id:62,cat:"荷重",q:"4t車対応",a:"4t車などの中型車が乗り入れる場合でも、現場条件が良ければ対応を検討できます。路盤品質、転圧、端部処理、必要に応じた鉄筋や厚み増しを組み合わせます。",points:["頻度が高い場合は路盤増厚","出入口や旋回部に注意","配送車が毎日入る施設は荷重条件を確認"]},
  {id:63,cat:"荷重",q:"大型車対応・耐荷重",a:"600mm角のドットコンプラスは耐荷重10トンまで対応可能という実務方針があります。重量車両にも比較的対応しやすい構造ですが、路床、路盤、転圧、排水条件を含めた全体設計が重要です。",points:["重量車両は路盤強化を検討","頻繁な大型車走行は設計者確認を推奨","沈下しやすい地盤では改良を検討"],note:"耐荷重10トンは600mm角ドットコンプラスの目安です。公共車道や常時大型車が走行する用途では、案件ごとに構造確認が必要です。"},
  {id:64,cat:"荷重",q:"荷重分散性能",a:"ドットコンプラスは約600mm角の構成により、荷重を一枚の大きな土間に集中させず、区画ごとに分散しやすい構造です。これにより、クラック抑制や地盤追従性の向上が期待できます。",points:["柔構造に近い考え方","大判土間よりひび割れリスクを下げやすい","路盤が弱いと効果が落ちる"]},
  {id:65,cat:"荷重",q:"路盤沈下対策",a:"沈下対策は路盤づくりが中心です。十分な転圧、良質な砕石、軟弱土の除去、埋戻し部の締固め、排水処理を行うことで、長期的な段差や水たまりを防ぎやすくなります。",points:["配管埋戻し部は特に注意","盛土部は沈下しやすい","砕石を層ごとに締め固める"]},
  {id:66,cat:"荷重",q:"不同沈下",a:"不同沈下は、部分的に地盤が弱い場所、埋戻しが甘い場所、雨水が溜まる場所で起こりやすいです。ドットコンプラスの構造は変形追従性がありますが、路床が大きく沈めば段差や割れの原因になります。",points:["地盤の硬さを均一にする","水が溜まる下層を作らない","軟弱部は置換や改良を検討"]},
  {id:67,cat:"荷重",q:"たわみ検討",a:"ドットコンプラスは単純に硬い板として考えるだけでなく、荷重分散と変形追従を重視した構造です。多少の地盤変形に追従しながら機能を維持しやすい考え方ですが、過度なたわみは避けるべきです。",points:["路盤の支持力を確保する","車両旋回部は強めに設計する","沈下が見込まれる地盤は改良する"]},
  {id:68,cat:"荷重",q:"地耐力不足対応",a:"地耐力が不足する場合は、路床改良、砕石置換、セメント改良、ジオテキスタイル、路盤厚増しを検討します。舗装材だけで軟弱地盤を解決するのではなく、下地を作ることが重要です。",points:["軟弱地盤は事前調査","水を含む土は入れ替え","必要に応じて設計者判断"]},
  {id:69,cat:"荷重",q:"支持層確認",a:"支持層は車両荷重を受けるための下地です。住宅では簡易確認で済む場合もありますが、公共施設や重量車両用途では、平板載荷、CBR、地盤調査などで確認することがあります。",points:["用途が重いほど確認精度を上げる","既存舗装撤去後に路床を確認する","沈下しそうな場所を先に処理する"]},
  {id:70,cat:"荷重",q:"構造計算必要性",a:"一般住宅の駐車場では経験的な標準仕様で進めることが多いですが、重量車両、公共工事、商業施設、工場では荷重条件を明確にして構造検討を行う方が安全です。",points:["普通車だけか、配送車が入るか確認","施工後に想定外車両が入らないように説明","公共案件では設計図書と整合させる"]},
  // 6. 製品形状関連
  {id:71,cat:"製品形状",q:"正方形タイプ用途",a:"正方形タイプは、ドットコンプラスの中でも貯留量が大きく、駐車場や大面積の雨水対策に向いています。1m²あたり約13.2Lの本体貯留量を持つため、機能を重視する提案で使いやすい形状です。",points:["住宅駐車場に向く","大面積で施工しやすい","貯留量説明がしやすい"]},
  {id:72,cat:"製品形状",q:"長方形タイプ用途",a:"長方形タイプはライン感のあるデザインを作りやすく、モダン住宅、店舗、アプローチに向きます。1m²あたり約9.9Lの本体貯留量を持ち、機能と意匠のバランスが良い形状です。",points:["細長い動線に合わせやすい","外構デザインに馴染みやすい","駐車場の見切りにも使いやすい"]},
  {id:73,cat:"製品形状",q:"六角形タイプ用途",a:"六角形タイプは景観性が高く、公園、店舗、歩行空間、エントランス周りに向きます。1m²あたり約9.8Lの本体貯留量を持ち、デザイン重視の案件で選ばれやすい形状です。",points:["曲線的な印象を作れる","店舗や公共空間で映える","意匠性を重視するお施主様向け"]},
  {id:74,cat:"製品形状",q:"直線部材用途",a:"直線部材は見切り、境界、ライン形成、端部処理に使いやすい部材です。舗装範囲の納まりをきれいにし、デザインラインを作る目的でも使えます。",points:["境界部の納まりを整える","デザインラインとして使う","端部補強と組み合わせる"]},
  {id:75,cat:"製品形状",q:"組合せ施工",a:"正方形、長方形、六角形、直線を組み合わせることで、用途別に機能とデザインを分けられます。例えば駐車場は正方形、アプローチは六角形、境界は直線という使い分けができます。",points:["機能重視ゾーンとデザインゾーンを分ける","色や仕上げとの組み合わせも検討","数量拾いを丁寧に行う"]},
  {id:76,cat:"製品形状",q:"曲線対応",a:"曲線や斜めの外構では、六角形や長方形を組み合わせると自然に納めやすい場合があります。完全な曲線では端部カットや見切り材を使って調整します。",points:["曲線部は歩留まりが落ちやすい","見切りラインを先に決める","カット部の強度と見た目を確認"]},
  {id:77,cat:"製品形状",q:"現場加工可否",a:"現場加工は可能な場合がありますが、できるだけ規格寸法で割り付ける方が施工精度、見た目、歩留まりが安定します。端部調整が必要な場合は、見切りや通常土間との併用も検討します。",points:["無理な細切れ加工を避ける","端部は割れやすくならないようにする","設計段階で割付を行う"]},
  {id:78,cat:"製品形状",q:"接続部処理",a:"既存舗装、通常土間、縁石、建物際との接続部は段差や割れが出やすい場所です。見切り材、端部補強、路盤の一体化、レベル調整を行い、歩行性と耐久性を確保します。",points:["段差を作らない","雨水が接続部へ集中しないようにする","端部の沈下を防ぐ"]},
  {id:79,cat:"製品形状",q:"レイアウト最適化",a:"レイアウトは見た目だけでなく、車両動線、水の流れ、排水先、施工性、材料ロスで決めます。まず水をどこで受け、どこへ逃がすかを決め、その上でデザインを整えます。",points:["車のタイヤ位置を確認","水が建物側へ行かないようにする","端部ロスを減らす割付にする"]},
  {id:80,cat:"製品形状",q:"材料歩留まり",a:"矩形の敷地では歩留まりが良く、曲線、斜め、複雑な形状ではカットやロスが増えます。見積では端部ロス、予備材、破損分を考慮します。",points:["規格寸法で割り付けると安い","複雑な形は施工費が上がる","予備材を少し見込む"]},
  // 7. 見積・単価関連
  {id:81,cat:"見積",q:"平米単価",a:"参考部材単価として、従来型Dotconパネルは1枚3,800円で約0.8m²相当です。DotconPlusは正方形4,800円/m²、長方形3,800円/m²、六角形3,700円/m²、直線部材1,500円/mが目安です。",points:["部材単価と施工単価を分けて説明する","送料は数量確定後に別途","生コン、砕石、掘削、残土は別途見積"],note:"単価は参考値です。案件時点の最新見積を確認してください。"},
  {id:82,cat:"見積",q:"材料単価",a:"材料単価にはフレーム部材のみが含まれる場合が多く、実際の工事では生コン、砕石、敷砂、見切り材、排水材、不織布、残土処分、重機、人件費が必要です。",points:["見積書では「材料」と「施工」を分ける","小規模ほど運搬費や人工割合が高い","遠方は送料が増える"]},
  {id:83,cat:"見積",q:"施工費込み試算",a:"施工費込みの金額は現場条件で大きく変わります。小規模住宅では12,000円から20,000円/m²程度になることがありますが、既存撤去、掘削量、残土処分、排水接続、面積で変動します。",points:["既存舗装撤去の有無を確認","残土処分費を忘れない","小面積は単価が上がりやすい"]},
  {id:84,cat:"見積",q:"運搬費",a:"運搬費は数量、配送距離、車上渡し条件、荷下ろし方法で変わります。部材はパレットや梱包で届くため、荷下ろし場所、人員、フォークリフトの有無を確認します。",points:["送料は数量確定後になりやすい","車上渡しは荷下ろし別途","狭小地は小運搬費が必要"]},
  {id:85,cat:"見積",q:"諸経費",a:"諸経費には現場管理、交通費、重機回送、廃材処分、清掃、養生、保険、写真管理などが入ります。公共案件や遠方案件では諸経費が大きくなることがあります。",points:["工事規模で比率が変わる","見積の透明性が大切","一式項目の中身を説明できるようにする"]},
  {id:86,cat:"見積",q:"数量割引",a:"大面積になると、材料搬入、施工手間、打設効率が良くなるため、単価が下がりやすいです。逆に小面積では最低人工や運搬費があるため、平米単価が高くなります。",points:["100m²以上は効率が出やすい","10m²前後は割高になりやすい","面積と形状で歩留まりが変わる"]},
  {id:87,cat:"見積",q:"面積別価格",a:"面積が増えるほど単価が下がる傾向がありますが、排水接続、残土、地盤改良があると総額は増えます。見積時は、面積だけでなく現場条件の聞き取りが必要です。",points:["施工面積だけで概算を断定しない","写真と寸法をもらう","現地調査後に正式見積とする"]},
  {id:88,cat:"見積",q:"比較見積",a:"比較対象は、土間コンクリート、アスファルト、インターロッキング、透水舗装、浸透トレンチ、地下貯留槽です。単純なm²単価だけでなく、排水設備、勾配、維持管理、環境価値を含めて比較します。",points:["安さだけなら通常舗装が有利な場合もある","雨水対策込みなら評価が変わる","長期維持管理も比較する"]},
  {id:89,cat:"見積",q:"他工法との価格差",a:"ドットコンは通常土間より材料費が増える場合がありますが、側溝、勾配、排水設備、景観仕上げ、雨水対策を同時に考えると、トータルで合理的になるケースがあります。",points:["単純単価ではなく機能込みで比較","排水設備削減の可能性を確認","お施主様には生活メリットも説明する"]},
  {id:90,cat:"見積",q:"コスト低減案",a:"全面施工が難しい場合は、水たまりが出る場所、雨水が集中する場所、駐車枠だけなど部分採用が有効です。通常土間や砕石舗装との併用も検討できます。",points:["部分採用で初期費用を抑える","機能が必要な場所に集中させる","デザインと予算のバランスを取る"]},
  {id:91,cat:"見積",q:"m²単価から総額換算",a:"m²単価 × 面積で概算総額を出します。例えば15,000円/m²で80m²なら1,200,000円です。これは本体工事だけの場合があり、既存撤去や排水接続は別途になることがあります。",points:["概算と正式見積を分ける","税別・税込を明確にする","付帯工事を別にする"]},
  {id:92,cat:"見積",q:"概算見積書作成",a:"概算見積には、施工面積、製品タイプ、路盤厚、既存撤去、残土量、生コン量、砕石量、排水接続、運搬費、諸経費を入れます。最低限、現場住所、写真、寸法、用途、車両条件が必要です。",points:["用途を必ず確認","乗用車か重量車か確認","雨水処理目的かデザイン目的か確認"]},
  // 8. 行政・条例関連
  {id:93,cat:"行政",q:"雨水流出抑制条例対応",a:"ドットコンは雨水を面で受け止め、路盤に一時貯留し、地盤へ浸透させるため、流出抑制施設として説明しやすい工法です。自治体によって扱いが異なるため、提出前に担当部署へ確認します。",points:["ピークカットを説明する","貯留量と浸透量を分けて示す","オーバーフロー先を示す"]},
  {id:94,cat:"行政",q:"開発協議対応",a:"開発協議では、対象面積、必要対策量、貯留量、浸透量、排水先、維持管理方法を整理します。ドットコンの面積だけでなく、集水範囲を正しく設定することが重要です。",points:["行政基準を先に確認","計算根拠を整理","維持管理者を明記"]},
  {id:95,cat:"行政",q:"自治体提出資料",a:"提出資料は、平面図、断面図、流域図、貯留計算書、浸透計算書、製品資料、維持管理計画、必要に応じて技術評価資料です。わかりやすい水の流れの図があると説明しやすくなります。",points:["図面で水の流れを見せる","貯留量の計算式を明記","施工後の清掃方法も入れる"]},
  {id:96,cat:"行政",q:"協議説明文",a:"協議では「排水設備をなくす」よりも「敷地内で雨水を一時的に受け止め、流出ピークを抑える」と説明します。過大な表現を避け、地盤条件とオーバーフローを含めて現実的に説明します。",points:["ピーク抑制という言葉が使いやすい","完全浸透を前提にしない","安全な排水逃がしを示す"]},
  {id:97,cat:"行政",q:"技術評価認定内容",a:"Dotcon工法は雨水貯留浸透技術として評価資料があります。内容として、雨水流出抑制、強度、施工性、運搬性、維持管理性、環境配慮などが整理されています。提出時は該当製品・工法との整合を確認します。",points:["資料名と対象工法を確認","DotconとDotconPlusの違いを説明","公共案件では最新版を添付"]},
  {id:98,cat:"行政",q:"NETIS関連",a:"NETISや公的登録の扱いは時点で変わる可能性があるため、案件ごとに最新状況を確認します。登録番号や申請状況が必要な場合は、社内の最新資料または担当者へ確認します。",points:["古い情報を使わない","公共工事では登録状況確認が重要","申請中と登録済みを混同しない"]},
  {id:99,cat:"行政",q:"認定書提出方法",a:"認定書や技術資料は、製品カタログだけでなく、計算書、断面図、維持管理計画とセットで提出すると説明が通りやすくなります。単に資料を添付するだけでなく、今回の計画にどう適用するかを示します。",points:["該当ページに印を付ける","計画断面と認定断面の違いを説明","行政担当者が読みやすい資料にする"]},
  {id:100,cat:"行政",q:"雨水貯留施設扱い",a:"自治体によって、透水舗装、浸透施設、貯留浸透施設、グリーンインフラなど扱いが変わります。ドットコンは舗装機能を持つため、単純な地下貯留槽とは異なる説明が必要です。",points:["担当部署へ事前相談","施設区分を確認","必要対策量に算入できるか確認"]},
  {id:101,cat:"行政",q:"補助金対象可否",a:"雨水浸透、緑化、グリーンインフラ、ヒートアイランド対策の補助金対象になる可能性がありますが、自治体ごとに条件が異なります。採用前に補助対象品目、申請時期、施工前申請の必要性を確認します。",points:["施工後申請不可の補助金に注意","写真と領収書が必要な場合がある","自治体名と制度名を確認"]},
  {id:102,cat:"行政",q:"行政説明用図面",a:"行政説明用図面では、施工範囲、集水面積、流入方向、貯留層、浸透面、オーバーフロー先、維持管理点検箇所を明記します。水の流れを矢印で示すと理解されやすいです。",points:["平面図と断面図をセットにする","水が建物側へ行かないことを示す","超過雨水の逃げ先を示す"]},
  // 9. 営業・提案関連
  {id:103,cat:"営業",q:"提案書作成",a:"提案書は、現状課題、雨水問題、ドットコンの仕組み、施工範囲、貯留量、排水計画、メンテナンス、概算費用、導入メリットの順で構成するとわかりやすいです。",points:["お施主様には生活メリットを先に伝える","施工業者には断面と手順を先に伝える","行政には計算と水の流れを先に示す"]},
  {id:104,cat:"営業",q:"比較表作成",a:"比較表では、土間コンクリート、透水舗装、インターロッキング、地下貯留槽、浸透トレンチと比較します。項目は、透水、貯留、施工性、維持管理、景観、コスト、荷重対応です。",points:["○×だけでなく理由を書く","単価だけで比較しない","長期管理も比較する"]},
  {id:105,cat:"営業",q:"メリット整理",a:"主なメリットは、水たまり軽減、排水負担軽減、ピークカット、景観性、クラック抑制、型枠省略、部分補修性、ESG、ヒートアイランド対策です。用途に応じてどのメリットを強調するかを変えます。",points:["住宅は水たまりと見た目","行政は流出抑制","企業はESGと環境価値"]},

// =============================================
// テキストユーティリティ
// =============================================
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function tokenize(text) {
  const tokens = new Set();
  text.split(/[\s　、。！？！？,，.．]+/).forEach(w => { if(w.length>=2) tokens.add(w); });
  for(let i=0;i<text.length-1;i++) tokens.add(text.slice(i,i+2));
  for(let i=0;i<text.length-2;i++) tokens.add(text.slice(i,i+3));
  for(let i=0;i<text.length-3;i++) tokens.add(text.slice(i,i+4));
  return tokens;
}

function highlightText(text, queryTokens) {
  const ranges = [];
  queryTokens.forEach(token => {
    if(token.length < 2) return;
    let idx = 0;
    while(true) {
      const pos = text.indexOf(token, idx);
      if(pos === -1) break;
      ranges.push([pos, pos + token.length]);
      idx = pos + 1;
    }
  });
  if(ranges.length === 0) return escHtml(text);
  ranges.sort((a,b) => a[0]-b[0]);
  const merged = [ranges[0]];
  for(let i=1;i<ranges.length;i++) {
    const last = merged[merged.length-1];
    if(ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
    else merged.push(ranges[i]);
  }
  let html = '', pos = 0;
  merged.forEach(([s,e]) => {
    html += escHtml(text.slice(pos,s));
    html += `<mark class="hl">${escHtml(text.slice(s,e))}</mark>`;
    pos = e;
  });
  html += escHtml(text.slice(pos));
  return html;
}

// =============================================
// スコアリング・検索
// =============================================
function scoreItem(item, queryTokens) {
  let score = 0;
  queryTokens.forEach(token => {
    if(token.length < 2) return;
    if(item.q.includes(token)) score += 5;
    if(item.cat.includes(token)) score += 3;
    if(item.a.includes(token)) score += 2;
    if((item.points||[]).join(' ').includes(token)) score += 1;
  });
  return score;
}

function search(query, maxResults=2) {
  const tokens = tokenize(query);
  return QA.map(item => ({item, score: scoreItem(item, tokens)}))
    .filter(x => x.score > 0)
    .sort((a,b) => b.score-a.score)
    .slice(0, maxResults)
    .map(x => x.item);
}

// =============================================
// サジェスト生成
// =============================================
function getSuggestions(results, query) {
  const resultIds = new Set(results.map(r => r.id));
  const tokens = tokenize(query);
  const sameCatItems = [];
  results.forEach(r => {
    QA.filter(q => q.cat === r.cat && !resultIds.has(q.id))
      .slice(0, 3)
      .forEach(q => { if(!sameCatItems.find(x=>x.id===q.id)) sameCatItems.push(q); });
  });
  const otherMatches = QA
    .filter(q => !resultIds.has(q.id) && !sameCatItems.find(x=>x.id===q.id))
    .map(q => ({q, score: scoreItem(q, tokens)}))
    .filter(x => x.score > 0)
    .sort((a,b) => b.score-a.score)
    .slice(0, 3)
    .map(x => x.q);
  const catRelated = {
    '基本仕様':['施工','貯留量計算','荷重'],
    '施工':['荷重','浸透計算','基本仕様'],
    '貯留量計算':['浸透計算','行政','施工'],
    '浸透計算':['貯留量計算','施工','維持管理'],
    '荷重':['施工','基本仕様','設計'],
    '見積':['施工','製品形状','維持管理'],
    '行政':['貯留量計算','浸透計算','設計'],
    '営業':['見積','基本仕様','比較'],
    '設計':['行政','施工','貯留量計算'],
    '維持管理':['施工','浸透計算','比較'],
    '比較':['見積','基本仕様','維持管理'],
    '製品形状':['施工','見積','設計'],
  };
  const relCats = results.flatMap(r => catRelated[r.cat] || []);
  const drillItems = [];
  relCats.forEach(cat => {
    const pick = QA.find(q => q.cat===cat && !resultIds.has(q.id) && !sameCatItems.find(x=>x.id===q.id) && !drillItems.find(x=>x.id===q.id));
    if(pick) drillItems.push(pick);
  });
  const seen = new Set();
  const all = [];
  [...sameCatItems.slice(0,2), ...otherMatches.slice(0,2), ...drillItems.slice(0,2)].forEach(q => {
    if(q && !seen.has(q.id) && all.length < 4) { seen.add(q.id); all.push(q); }
  });
  return all;
}

// =============================================
// ナラティブ回答生成
// =============================================
function makeNarrative(item, query, tokens) {
  let intro = `「${item.q}」についてお答えします。`;
  if(/何cm|何mm|何m|厚み|厚さ|深さ|高さ/.test(query)) intro = `寸法・厚みに関するご質問です。`;
  else if(/いくら|費用|単価|価格|コスト/.test(query)) intro = `費用・コストに関するご質問です。`;
  else if(/違い|比較|差|vs/.test(query)) intro = `比較に関するご質問です。`;
  else if(/できます|可能|大丈夫|対応/.test(query)) intro = `対応可否に関するご質問です。`;
  else if(/方法|やり方|手順|どうやって/.test(query)) intro = `施工・方法に関するご質問です。`;
  else if(/行政|条例|協議|申請/.test(query)) intro = `行政・条例に関するご質問です。`;
  else if(/なぜ|なんで|理由|なに|とは/.test(query)) intro = `基本的な仕組みに関するご質問です。`;
  const highlightedA = highlightText(item.a, tokens);
  return `<span style="font-size:12px;color:#888;">${escHtml(intro)}</span><br><br>${highlightedA}`;
}

// =============================================
// UI構築
// =============================================
function buildAnswerBubbleHtml(results, query) {
  const tokens = tokenize(query);
  let html = '';
  results.forEach((item) => {
    const narrative = makeNarrative(item, query, tokens);
    const pointsHtml = (item.points||[]).map(p =>
      `<div class="point-item">${highlightText(p, tokens)}</div>`
    ).join('');
    const noteHtml = item.note
      ? `<div class="note-box">⚠️ ${highlightText(item.note, tokens)}</div>` : '';
    const detailId = `detail-${item.id}-${Date.now()}`;
    html += `
    <div class="answer-card">
      <div class="citation">📖 Q${item.id}「${escHtml(item.q)}」より</div>
      <div class="narrative">${narrative}</div>
      ${item.points && item.points.length ? `
        <span class="detail-toggle" onclick="toggleDetail('${detailId}')">
          <span id="arr-${detailId}">▶</span> 実務ポイントを見る
        </span>
        <div class="detail-body" id="${detailId}">
          <div class="point-list">${pointsHtml}</div>
          ${noteHtml}
        </div>
      ` : noteHtml}
    </div>`;
  });
  const suggestions = getSuggestions(results, query);
  if(suggestions.length > 0) {
    const chips = suggestions.map(s =>
      `<button class="suggest-chip" onclick="askSuggest(${JSON.stringify(s.q)})">🔍 ${escHtml(s.q)}</button>`
    ).join('');
    html += `
    <div class="suggest-block">
      <div class="suggest-label">💡 関連する質問・ドリルダウン</div>
      <div class="suggest-chips">${chips}</div>
    </div>`;
  }
  return html;
}

function toggleDetail(id) {
  const el = document.getElementById(id);
  const arr = document.getElementById('arr-' + id);
  if(el.classList.contains('open')) {
    el.classList.remove('open'); arr.textContent = '▶';
  } else {
    el.classList.add('open'); arr.textContent = '▼';
  }
}

function askSuggest(question) {
  document.getElementById('user-input').value = question;
  handleSend();
}

// =============================================
// メッセージ追加
// =============================================
function addUserMessage(text) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg user';
  msg.innerHTML = `<div class="msg-label">あなた</div><div class="bubble">${escHtml(text)}</div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function addBotHtml(html) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'DOTCONボット';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;
  msg.appendChild(label);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg bot'; msg.id = 'typing-msg';
  msg.innerHTML = `<div class="msg-label">DOTCONボット</div>
    <div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping() { const e=document.getElementById('typing-msg'); if(e) e.remove(); }

// =============================================
// 送信・カテゴリ検索
// =============================================
function handleSend() {
  const input = document.getElementById('user-input');
  const query = input.value.trim();
  if(!query) return;
  addUserMessage(query);
  input.value = '';
  showTyping();
  setTimeout(() => {
    removeTyping();
    const results = search(query, 2);
    if(results.length === 0) {
      addBotHtml('<p style="color:#666;">該当する情報が見つかりませんでした。<br>上部のカテゴリボタンや別の言葉でお試しください。</p>');
    } else {
      addBotHtml(buildAnswerBubbleHtml(results, query));
    }
  }, 500);
}

function categorySearch(cat) {
  const items = QA.filter(q => q.cat.includes(cat)).slice(0,3);
  const query = cat + 'について教えてください';
  addUserMessage(query);
  showTyping();
  setTimeout(() => {
    removeTyping();
    addBotHtml(buildAnswerBubbleHtml(items, cat));
  }, 400);
}

document.getElementById('user-input').addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
